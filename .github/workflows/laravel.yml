name: Laravel

on:
  push:
    branches:
      - main
      - casoestudio3-C4E332-branch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: PHPUnit y Pest (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Configurar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p build/test-results
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Ejecutar tests y registrar resultados
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -o pipefail
          php artisan test --log-junit build/test-results/junit.xml 2>&1 | tee build/test-results/ejecucion.txt

      - name: Guardar evidencia de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-${{ github.run_number }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 30
